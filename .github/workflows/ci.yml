name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: |
          npm run build --workspace @wisp/studio
          npm run build --workspace @wisp/desktop

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Electron needs a display even when it never shows a window, and the
      # desktop and host-mode suites launch the real app rather than a mock.
      - name: End-to-end tests
        run: xvfb-run -a npx playwright test
        env:
          CI: "1"
